# =============================================================================
# build-macos.yml — Compilation macOS ET Linux de NkRef sur runners GitHub,
# avec ARTEFACTS téléchargeables (paquets pour les testeurs).
#
# POURQUOI : aucun Mac sous la main — cette CI est notre seule machine Apple
# (demande Rihen, 2026-08-11). Jenga et Nkentseu étant publics, le runner
# clone tout en HTTPS sans secret, minutes illimitées.
#
# Déclenchement : manuel (workflow_dispatch) + push sur main et feat/**.
# Le backend Cocoa a été complété À L'AVEUGLE (SetDecorated, BeginDragMove…) :
# les premières exécutions SERVENT à révéler les erreurs — un échec macOS est
# une information, pas une surprise. Le job Linux, lui, reproduit un chemin
# déjà prouvé sous WSL2 (XLib + GLX Mesa).
# =============================================================================
name: build-desktop

on:
  workflow_dispatch:
    inputs:
      jenga_ref:
        description: "Ref de Jenga a la place du tag v<JENGA_VERSION> (vide = .github/JENGA_REF, sinon le tag)"
        required: false
        type: string
        default: ""
      # (22/10/2026) Les kits macOS (job kits-macos, plus bas) : SEULEMENT a la main, avec cette case cochee.
      # Cochee, les autres jobs de ce flux ne tournent pas (ils tournent a chaque poussee, comme avant).
      kits:
        description: "Construire les kits macOS des bibliotheques publiques (arm64 et x86_64), et seulement eux"
        required: false
        type: boolean
        default: false
      bibliotheques:
        description: "Kits a construire (vide = les 34 bibliotheques publiques utilisables)"
        required: false
        type: string
        default: ""
  push:
    branches: [main, "feat/**"]
    paths:
      - "Kernel/**"
      - "Applications/NkRef/**"
      - "Nkentseu.jenga"
      - "config/**"
      - ".github/workflows/build-macos.yml"
      - ".github/JENGA_REF"
      - ".github/scripts/ref-jenga.sh"

env:
  # Derogation TEMPORAIRE au tag de Jenga (voir .github/scripts/ref-jenga.sh).
  JENGA_REF_FORCEE: ${{ inputs.jenga_ref || '' }}

jobs:
  nkref-macos:
    if: ${{ !inputs.kits }} # (22/10/2026) pas quand on lance les kits a la main
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Depot Nkentseu (+ sous-modules Externals)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version de Jenga exigee par NKCode
        id: jenga-version
        run: |
          # SOURCE UNIQUE : config/JENGA_VERSION. Aucun numero en
          # dur ici, donc aucune divergence possible. Ce champ a porte
          # `feat/evenement-avertissement` (Jenga 2.4.0) pendant que NKCode
          # passait a 2.8.0 : le chargement du workspace s'arretait sur
          # « name 'appurl' is not defined », message qui ne parle pas de Jenga.
          V=$(grep -v '^#' config/JENGA_VERSION | tr -d '[:space:]')
          test -n "$V" || { echo "::error::JENGA_VERSION vide ou introuvable"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # Tag v$V, SAUF derogation temporaire (.github/JENGA_REF) : ref-jenga.sh.
          bash .github/scripts/ref-jenga.sh "$V" "${JENGA_REF_FORCEE:-}"
          echo "Jenga exige par NKCode : $V"

      - name: Depot Jenga (public, la source EST le build system)
        uses: actions/checkout@v4
        with:
          repository: Rihen-Universe/Jenga
          # Epingle sur le TAG de la release, lu dans JENGA_VERSION.
          # Ne JAMAIS remettre un nom de branche ici : c'est ainsi que
          # la CI a construit avec Jenga 2.4.0 pendant que NKCode en
          # exigeait 2.8.0. La SEULE derogation passe par .github/JENGA_REF
          # (temporaire, annoncee en avertissement : voir ref-jenga.sh).
          ref: ${{ steps.jenga-version.outputs.ref }}
          path: jenga-src

      - name: Builder NkRef (Release)
        env:
          # Le paquet Python `Jenga` vit a la racine du depot Jenga.
          PYTHONPATH: ${{ github.workspace }}/jenga-src
          # (09/10/2026) Sans cible, clang compile pour le macOS du RUNNER : le
          # binaire de NkRef 0.1.0 exigeait macOS 26 (LC_BUILD_VERSION minos 26.0)
          # et ne s'ouvrait sur aucun Mac en macOS 13, 14 ou 15. 11.0 = premier
          # macOS des Mac a puce Apple, et la valeur de Jenga (Commands/Gen.py).
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          python3 --version
          # construire.sh publie les erreurs en ANNOTATIONS (lisibles sans
          # compte) : du 26/09 au 30/09, ce job ne disait que « exit code 1 ».
          chmod +x .github/scripts/*.sh
          .github/scripts/construire.sh build NkRef Release journaux

      - name: Le binaire tourne sur macOS 11 (minos)
        run: |
          set -e
          BIN=$(find Build/Bin -type f -name NkRef -path "*Release*" | head -1)
          MINOS=$(otool -l "$BIN" | awk '/LC_BUILD_VERSION/{v=1} v && /minos/{print $2; exit}')
          echo "minos du binaire : $MINOS"
          test "$MINOS" = "11.0" || { echo "::error::NkRef exige macOS $MINOS (attendu 11.0)"; exit 1; }

      - name: Empaqueter (tar.gz pour testeurs)
        run: |
          set -e
          BIN=$(find Build/Bin -type f -name NkRef -path "*Release*" | head -1)
          echo "binaire: $BIN"
          mkdir -p paquet/NkRef-macOS
          cp "$BIN" paquet/NkRef-macOS/
          cp Applications/NkRef/LISEZMOI-TESTEURS.md paquet/NkRef-macOS/ || true
          tar -czf NkRef-macOS.tar.gz -C paquet NkRef-macOS
          ls -l NkRef-macOS.tar.gz

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: NkRef-macOS
          path: NkRef-macOS.tar.gz

  # (10/10/2026) LA CONFIGURATION DE KARL : un Mac AVEC le SDK Vulkan (LunarG).
  # NKCanvas compile alors son dorsal Vulkan, et vulkan_metal.h
  # (`typedef void CAMetalLayer;`) heurtait NkSurface.h
  # (`using CAMetalLayer = struct objc_object;`) : 16 erreurs dans 8 fichiers.
  # Le job nkref-macos ne le voyait pas : sans VULKAN_SDK, config/graphics.jenga
  # n'active pas Vulkan. Ici, les en-tetes Vulkan de Homebrew tiennent lieu de
  # SDK (VULKAN_SDK -> Include, disque insensible a la casse), et on construit
  # NKCanvas : la bibliotheque statique ne demande que les en-tetes.
  nkcanvas-macos-vulkan:
    if: ${{ !inputs.kits }} # (22/10/2026) pas quand on lance les kits a la main
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Depot Nkentseu (+ sous-modules Externals)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version de Jenga exigee par NKCode
        id: jenga-version
        run: |
          V=$(grep -v '^#' config/JENGA_VERSION | tr -d '[:space:]')
          test -n "$V" || { echo "::error::JENGA_VERSION vide ou introuvable"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          bash .github/scripts/ref-jenga.sh "$V" "${JENGA_REF_FORCEE:-}"

      - name: Depot Jenga (public, la source EST le build system)
        uses: actions/checkout@v4
        with:
          repository: Rihen-Universe/Jenga
          ref: ${{ steps.jenga-version.outputs.ref }}
          path: jenga-src

      - name: En-tetes Vulkan (Homebrew), comme un SDK installe
        run: |
          brew install vulkan-headers
          P=$(brew --prefix vulkan-headers)
          test -f "$P/include/vulkan/vulkan_metal.h" || { echo "::error::vulkan_metal.h absent de $P"; exit 1; }
          grep -n "CAMetalLayer" "$P/include/vulkan/vulkan_metal.h" | head -3
          echo "VULKAN_SDK=$P" >> "$GITHUB_ENV"

      - name: Builder NKCanvas (Release) avec Vulkan
        env:
          PYTHONPATH: ${{ github.workspace }}/jenga-src
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          echo "VULKAN_SDK=$VULKAN_SDK"
          chmod +x .github/scripts/*.sh
          .github/scripts/construire.sh build NKCanvas Release journaux

      # (10/10/2026) Le deuxieme arret de Karl : NKCamera, dont le dorsal Cocoa
      # (.mm) n'est compile que sur Mac -- `NkString::c_str()` n'existe pas.
      # Ce job s'arretait avant (NKCanvas seul) : il construit aussi NKCamera.
      - name: Builder NKCamera (Release)
        env:
          PYTHONPATH: ${{ github.workspace }}/jenga-src
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          .github/scripts/construire.sh build NKCamera Release journaux-camera

  nkref-linux:
    if: ${{ !inputs.kits }} # (22/10/2026) pas quand on lance les kits a la main
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Depot Nkentseu (+ sous-modules Externals)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version de Jenga exigee par NKCode
        id: jenga-version
        run: |
          # SOURCE UNIQUE : config/JENGA_VERSION. Aucun numero en
          # dur ici, donc aucune divergence possible. Ce champ a porte
          # `feat/evenement-avertissement` (Jenga 2.4.0) pendant que NKCode
          # passait a 2.8.0 : le chargement du workspace s'arretait sur
          # « name 'appurl' is not defined », message qui ne parle pas de Jenga.
          V=$(grep -v '^#' config/JENGA_VERSION | tr -d '[:space:]')
          test -n "$V" || { echo "::error::JENGA_VERSION vide ou introuvable"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # Tag v$V, SAUF derogation temporaire (.github/JENGA_REF) : ref-jenga.sh.
          bash .github/scripts/ref-jenga.sh "$V" "${JENGA_REF_FORCEE:-}"
          echo "Jenga exige par NKCode : $V"

      - name: Depot Jenga (public, la source EST le build system)
        uses: actions/checkout@v4
        with:
          repository: Rihen-Universe/Jenga
          # Epingle sur le TAG de la release, lu dans JENGA_VERSION.
          # Ne JAMAIS remettre un nom de branche ici : c'est ainsi que
          # la CI a construit avec Jenga 2.4.0 pendant que NKCode en
          # exigeait 2.8.0. La SEULE derogation passe par .github/JENGA_REF
          # (temporaire, annoncee en avertissement : voir ref-jenga.sh).
          ref: ${{ steps.jenga-version.outputs.ref }}
          path: jenga-src

      - name: Dependances systeme (XLib + GL, le chemin prouve sous WSL2)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libx11-dev libxrandr-dev libxext-dev libgl1-mesa-dev

      - name: Builder NkRef (Release)
        env:
          PYTHONPATH: ${{ github.workspace }}/jenga-src
        run: |
          python3 --version
          chmod +x .github/scripts/*.sh
          .github/scripts/construire.sh build NkRef Release journaux

      - name: Empaqueter (tar.gz pour testeurs)
        run: |
          set -e
          BIN=Build/Bin/Release-Linux/NkRef/NkRef
          test -f "$BIN"
          mkdir -p paquet/NkRef-Linux
          cp "$BIN" paquet/NkRef-Linux/
          cp Applications/NkRef/LISEZMOI-TESTEURS.md paquet/NkRef-Linux/ || true
          tar -czf NkRef-Linux-x86_64.tar.gz -C paquet NkRef-Linux
          ls -l NkRef-Linux-x86_64.tar.gz

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: NkRef-Linux-x86_64
          path: NkRef-Linux-x86_64.tar.gz

  # ===========================================================================
  # (22/10/2026) LES KITS macOS DES BIBLIOTHEQUES PUBLIQUES (moteur-retours, tache 10a)
  # ===========================================================================
  # Rodolf (14/10) : les kits macOS passent par GitHub Actions, dans CE flux ; (22/10) « publie tout meme les
  # kits », « ne pas oublier linux et macos ». Un kit par bibliotheque publique (la liste mesuree des 34
  # utilisables : Tests/agents_14-10/bancs_moteur-retours/bibliotheques_publiques.py, sans les 3 integrations,
  # dont les en-tetes ne partent pas dans un kit), avec ses dependances, STATIQUE, Debug et Release ; macOS 12
  # au minimum ; arm64 (macos-latest) et x86_64 (macos-15-intel). Les memes kits que ceux de Windows et Linux
  # du 21-22/10 (C:\Rihen\Livraisons\Kits_2026-10-21).
  #
  # SANS VULKAN : sur macOS, Vulkan n'est que MoltenVK et exigerait le chargeur libvulkan chez l'apprenant ;
  # sans lui, NKRHI garde Metal et OpenGL (config/graphics.jenga, NK_ENABLE_VULKAN=0 ; NKRHI.jenga active
  # Metal sur macOS dans tous les cas). Le programme d'un apprenant ne demande alors que des frameworks du
  # systeme.
  #
  # CHAQUE KIT EST EPROUVE comme sous Linux : un workspace qui charge le kit, un programme qui inclut l'en-tete
  # de la bibliotheque, Debug et Release, le programme lance. Le resume (vert / rouge par kit) est dans le
  # resume du job et dans l'artefact.
  #
  # Nom : <Bibliotheque>-kit-macos-<arm64|x86_64>-appleclang-libcxx-statique.zip
  # Ne tourne QU'A LA MAIN :  gh workflow run build-macos.yml -f kits=true   (-f bibliotheques="NKCore NKMath")
  kits-macos:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.kits }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 340
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      NK_ENABLE_VULKAN: "0"
      PYTHONPATH: ${{ github.workspace }}/jenga-src
      BIBLIOTHEQUES: ${{ inputs.bibliotheques || 'NKPlatform NKCore NKMemory NKContainers NKMath NKThreading NKLogger NKTime NKFileSystem NKStream NKReflection NKSerialization NKNetwork NKConverse NKImage NKFont NKAudio NKMedia NKEvent NKWindow NKSL NKRHI NKCanvas NKRenderer NKVFX NKECS NKUI NKGui NKCamera NKCollision NKPhysics NKAnima NKNavigation NKXR' }}
    steps:
      - name: Depot Nkentseu (+ sous-modules Externals)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version de Jenga exigee
        id: jenga-version
        run: |
          V=$(grep -v '^#' config/JENGA_VERSION | tr -d '[:space:]')
          test -n "$V" || { echo "::error::JENGA_VERSION vide ou introuvable"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          bash .github/scripts/ref-jenga.sh "$V" "${JENGA_REF_FORCEE:-}"

      - name: Depot Jenga (public, la source EST le build system)
        uses: actions/checkout@v4
        with:
          repository: Rihen-Universe/Jenga
          ref: ${{ steps.jenga-version.outputs.ref }}
          path: jenga-src

      - name: Construire chaque bibliotheque (Debug, Release) - ${{ matrix.arch }}
        run: |
          set -u
          mkdir -p journaux
          sysctl -n hw.ncpu
          for C in Debug Release; do
            for B in $BIBLIOTHEQUES; do
              if python3 -m Jenga build --target "$B" --config $C --no-daemon > "journaux/build_${B}_${C}.log" 2>&1; then
                echo "$B $C : construit"
              else
                echo "$B $C : ECHEC" | tee -a journaux/echecs.txt
                tail -40 "journaux/build_${B}_${C}.log" | grep -E "error|undefined" | head -5 || true
              fi
            done
          done

      - name: Extraire et eprouver chaque kit - ${{ matrix.arch }}
        run: |
          set -u
          mkdir -p kits sortie essais
          R=journaux/resume.md
          printf '| Kit | Archive | Epreuve Debug | Epreuve Release |\n|---|---|---|---|\n' > "$R"
          for B in $BIBLIOTHEQUES; do
            if grep -q "^$B " journaux/echecs.txt 2> /dev/null; then
              echo "| $B | non construit | - | - |" >> "$R"; continue
            fi
            if ! python3 scripts/MakeKit.py --name "$B" --target "$B" --sortie sortie > "journaux/makekit_$B.log" 2>&1; then
              echo "| $B | MakeKit en echec | - | - |" >> "$R"; continue
            fi
            Z=$(ls sortie/"$B"-kit-*.zip | head -1)
            NOM="$B-kit-macos-${{ matrix.arch }}-appleclang-libcxx-statique.zip"
            cp "$Z" "kits/$NOM"
            # L'epreuve : l'en-tete parapluie de la bibliotheque s'il existe, sinon son premier en-tete
            INC="sortie/Kits/$B/include"
            H=""
            [ -f "$INC/$B/$B.h" ] && H="$B/$B.h"
            [ -z "$H" ] && H=$(cd "$INC" && find "$B" -maxdepth 1 -name '*.h' | sort | head -1)
            W="essais/$B"
            mkdir -p "$W"
            printf '%s\n' "#include \"$H\"" "int main() { return 0; }" > "$W/main.cpp"
            FN="use$(echo "$B" | tr '[:upper:]' '[:lower:]')"
            printf '%s\n' 'from Jenga import *' "useconfig(\"$PWD/sortie/Kits/$B/$B.jenga\")" '' 'with workspace("Essai"):' \
              '    RegisterJengaGlobalToolchains()' '    configurations(["Debug", "Release"])' \
              '    with project("App"):' '        consoleapp()' '        language("C++")' '        cppdialect("C++17")' \
              '        files(["main.cpp"])' "        $FN()" > "$W/Essai.jenga"
            EP=""
            for C in Debug Release; do
              if (cd "$W" && python3 -m Jenga build --config $C --no-daemon > "build_$C.log" 2>&1); then
                X=$(find "$W/Build/Bin" -type f -name App -perm -u+x | grep "$C" | head -1)
                if [ -n "$X" ] && "$X"; then EP="$EP | vert"; else EP="$EP | ROUGE (lancement)"; fi
              else
                EP="$EP | ROUGE (construction)"
                cp "$W/build_$C.log" "journaux/essai_${B}_$C.log"
              fi
            done
            echo "| $B | $NOM$EP |" >> "$R"
          done
          (cd kits && shasum -a 256 *.zip > SHA256SUMS-macos-${{ matrix.arch }}.txt)
          cat "$R" >> "$GITHUB_STEP_SUMMARY"
          ls -l kits

      - name: Artefact - kits macOS ${{ matrix.arch }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kits-macos-${{ matrix.arch }}
          path: |
            kits/
            journaux/
