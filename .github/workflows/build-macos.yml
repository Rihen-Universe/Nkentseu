# =============================================================================
# build-macos.yml — Compilation macOS ET Linux de NkRef sur runners GitHub,
# avec ARTEFACTS téléchargeables (paquets pour les testeurs).
#
# POURQUOI : aucun Mac sous la main — cette CI est notre seule machine Apple
# (demande Rihen, 2026-08-11). Jenga et Nkentseu étant publics, le runner
# clone tout en HTTPS sans secret, minutes illimitées.
#
# Déclenchement : manuel (workflow_dispatch) + push sur main et feat/**.
# Le backend Cocoa a été complété À L'AVEUGLE (SetDecorated, BeginDragMove…) :
# les premières exécutions SERVENT à révéler les erreurs — un échec macOS est
# une information, pas une surprise. Le job Linux, lui, reproduit un chemin
# déjà prouvé sous WSL2 (XLib + GLX Mesa).
# =============================================================================
name: build-desktop

on:
  workflow_dispatch:
    inputs:
      jenga_ref:
        description: "Ref de Jenga a la place du tag v<JENGA_VERSION> (vide = .github/JENGA_REF, sinon le tag)"
        required: false
        type: string
        default: ""
  push:
    branches: [main, "feat/**"]
    paths:
      - "Kernel/**"
      - "Applications/NkRef/**"
      - "Nkentseu.jenga"
      - "config/**"
      - ".github/workflows/build-macos.yml"
      - ".github/JENGA_REF"
      - ".github/scripts/ref-jenga.sh"

env:
  # Derogation TEMPORAIRE au tag de Jenga (voir .github/scripts/ref-jenga.sh).
  JENGA_REF_FORCEE: ${{ inputs.jenga_ref || '' }}

jobs:
  nkref-macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Depot Nkentseu (+ sous-modules Externals)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version de Jenga exigee par NKCode
        id: jenga-version
        run: |
          # SOURCE UNIQUE : config/JENGA_VERSION. Aucun numero en
          # dur ici, donc aucune divergence possible. Ce champ a porte
          # `feat/evenement-avertissement` (Jenga 2.4.0) pendant que NKCode
          # passait a 2.8.0 : le chargement du workspace s'arretait sur
          # « name 'appurl' is not defined », message qui ne parle pas de Jenga.
          V=$(grep -v '^#' config/JENGA_VERSION | tr -d '[:space:]')
          test -n "$V" || { echo "::error::JENGA_VERSION vide ou introuvable"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # Tag v$V, SAUF derogation temporaire (.github/JENGA_REF) : ref-jenga.sh.
          bash .github/scripts/ref-jenga.sh "$V" "${JENGA_REF_FORCEE:-}"
          echo "Jenga exige par NKCode : $V"

      - name: Depot Jenga (public, la source EST le build system)
        uses: actions/checkout@v4
        with:
          repository: Rihen-Universe/Jenga
          # Epingle sur le TAG de la release, lu dans JENGA_VERSION.
          # Ne JAMAIS remettre un nom de branche ici : c'est ainsi que
          # la CI a construit avec Jenga 2.4.0 pendant que NKCode en
          # exigeait 2.8.0. La SEULE derogation passe par .github/JENGA_REF
          # (temporaire, annoncee en avertissement : voir ref-jenga.sh).
          ref: ${{ steps.jenga-version.outputs.ref }}
          path: jenga-src

      - name: Builder NkRef (Release)
        env:
          # Le paquet Python `Jenga` vit a la racine du depot Jenga.
          PYTHONPATH: ${{ github.workspace }}/jenga-src
          # (09/10/2026) Sans cible, clang compile pour le macOS du RUNNER : le
          # binaire de NkRef 0.1.0 exigeait macOS 26 (LC_BUILD_VERSION minos 26.0)
          # et ne s'ouvrait sur aucun Mac en macOS 13, 14 ou 15. 11.0 = premier
          # macOS des Mac a puce Apple, et la valeur de Jenga (Commands/Gen.py).
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          python3 --version
          # construire.sh publie les erreurs en ANNOTATIONS (lisibles sans
          # compte) : du 26/09 au 30/09, ce job ne disait que « exit code 1 ».
          chmod +x .github/scripts/*.sh
          .github/scripts/construire.sh build NkRef Release journaux

      - name: Le binaire tourne sur macOS 11 (minos)
        run: |
          set -e
          BIN=$(find Build/Bin -type f -name NkRef -path "*Release*" | head -1)
          MINOS=$(otool -l "$BIN" | awk '/LC_BUILD_VERSION/{v=1} v && /minos/{print $2; exit}')
          echo "minos du binaire : $MINOS"
          test "$MINOS" = "11.0" || { echo "::error::NkRef exige macOS $MINOS (attendu 11.0)"; exit 1; }

      - name: Empaqueter (tar.gz pour testeurs)
        run: |
          set -e
          BIN=$(find Build/Bin -type f -name NkRef -path "*Release*" | head -1)
          echo "binaire: $BIN"
          mkdir -p paquet/NkRef-macOS
          cp "$BIN" paquet/NkRef-macOS/
          cp Applications/NkRef/LISEZMOI-TESTEURS.md paquet/NkRef-macOS/ || true
          tar -czf NkRef-macOS.tar.gz -C paquet NkRef-macOS
          ls -l NkRef-macOS.tar.gz

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: NkRef-macOS
          path: NkRef-macOS.tar.gz

  nkref-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Depot Nkentseu (+ sous-modules Externals)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version de Jenga exigee par NKCode
        id: jenga-version
        run: |
          # SOURCE UNIQUE : config/JENGA_VERSION. Aucun numero en
          # dur ici, donc aucune divergence possible. Ce champ a porte
          # `feat/evenement-avertissement` (Jenga 2.4.0) pendant que NKCode
          # passait a 2.8.0 : le chargement du workspace s'arretait sur
          # « name 'appurl' is not defined », message qui ne parle pas de Jenga.
          V=$(grep -v '^#' config/JENGA_VERSION | tr -d '[:space:]')
          test -n "$V" || { echo "::error::JENGA_VERSION vide ou introuvable"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # Tag v$V, SAUF derogation temporaire (.github/JENGA_REF) : ref-jenga.sh.
          bash .github/scripts/ref-jenga.sh "$V" "${JENGA_REF_FORCEE:-}"
          echo "Jenga exige par NKCode : $V"

      - name: Depot Jenga (public, la source EST le build system)
        uses: actions/checkout@v4
        with:
          repository: Rihen-Universe/Jenga
          # Epingle sur le TAG de la release, lu dans JENGA_VERSION.
          # Ne JAMAIS remettre un nom de branche ici : c'est ainsi que
          # la CI a construit avec Jenga 2.4.0 pendant que NKCode en
          # exigeait 2.8.0. La SEULE derogation passe par .github/JENGA_REF
          # (temporaire, annoncee en avertissement : voir ref-jenga.sh).
          ref: ${{ steps.jenga-version.outputs.ref }}
          path: jenga-src

      - name: Dependances systeme (XLib + GL, le chemin prouve sous WSL2)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libx11-dev libxrandr-dev libxext-dev libgl1-mesa-dev

      - name: Builder NkRef (Release)
        env:
          PYTHONPATH: ${{ github.workspace }}/jenga-src
        run: |
          python3 --version
          chmod +x .github/scripts/*.sh
          .github/scripts/construire.sh build NkRef Release journaux

      - name: Empaqueter (tar.gz pour testeurs)
        run: |
          set -e
          BIN=Build/Bin/Release-Linux/NkRef/NkRef
          test -f "$BIN"
          mkdir -p paquet/NkRef-Linux
          cp "$BIN" paquet/NkRef-Linux/
          cp Applications/NkRef/LISEZMOI-TESTEURS.md paquet/NkRef-Linux/ || true
          tar -czf NkRef-Linux-x86_64.tar.gz -C paquet NkRef-Linux
          ls -l NkRef-Linux-x86_64.tar.gz

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: NkRef-Linux-x86_64
          path: NkRef-Linux-x86_64.tar.gz
