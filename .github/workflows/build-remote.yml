# =============================================================================
# build-remote.yml — Compilation À LA DEMANDE d'une cible jenga sur une
# plateforme au choix (macOS / Linux / iOS), avec artefact.
#
# C'est la brique générique que `jenga build --remote` appellera un jour
# (proposition d'architecture du 2026-08-11) ; en attendant elle se pilote à
# la main : onglet Actions > build-remote > Run workflow, ou
#   gh workflow run build-remote.yml -f target=NKCode -f platform=macos
#
# Honnêteté : une cible qui n'a JAMAIS été compilée sur une plateforme y
# échouera probablement d'abord (précédent : 6 itérations pour NkRef/macOS).
# Un échec ici est une INFORMATION sur l'état du portage, pas une surprise.
# =============================================================================
name: build-remote

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Cible jenga (NkRef, NKCode, Pong, renderdemo...)"
        required: true
        default: "NkRef"
      platform:
        description: "Plateforme"
        required: true
        type: choice
        options: [macos, linux, ios]
        default: "macos"
      config:
        description: "Configuration"
        required: true
        type: choice
        options: [Release, Debug]
        default: "Release"

jobs:
  build:
    # ubuntu-22.04 et PAS ubuntu-latest (24.04) : la glibc du runner devient le
    # MINIMUM requis chez les testeurs (le paquet 24.04 exigeait GLIBC_2.38 et
    # refusait de se charger sur Ubuntu 22.04/Debian 12 — vu au test WSL2).
    runs-on: ${{ inputs.platform == 'linux' && 'ubuntu-22.04' || 'macos-latest' }}
    timeout-minutes: 60
    steps:
      - name: Depot Nkentseu (+ sous-modules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version de Jenga exigee par NKCode
        id: jenga-version
        run: |
          # SOURCE UNIQUE : Applications/NKCode/JENGA_VERSION. Ce fichier ne
          # porte plus de numero en dur ici, donc il ne peut plus diverger.
          # Avant, `ref:` etait ecrit a la main et il est reste en 2.6.3 pendant
          # que NKCode passait a 2.8.0 : la construction macOS s'arretait sur
          # « name 'appurl' is not defined », message qui ne parle pas de Jenga.
          V=$(grep -v '^#' Applications/NKCode/JENGA_VERSION | tr -d '[:space:]')
          test -n "$V" || { echo "::error::JENGA_VERSION vide ou introuvable"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Jenga exige par NKCode : $V"

      - name: Depot Jenga
        uses: actions/checkout@v4
        with:
          repository: Rihen-Universe/Jenga
          # ⚠️ Epingle sur le TAG de la release, pas sur une branche. Jusqu'au
          # 2026-09-08 ce champ pointait `feat/evenement-avertissement`, restee
          # en 2.4.0 : les paquets macOS/Linux embarquaient donc un Jenga plus
          # vieux que le paquet Windows, sans que rien ne le dise. La branche
          # est un ANCETRE de v2.6.3 (verifie par merge-base), rien ne se perd.
          # Bumper ce tag a chaque release de Jenga.
          ref: v${{ steps.jenga-version.outputs.version }}
          path: jenga-src

      - name: Dependances systeme (Linux)
        if: inputs.platform == 'linux'
        run: |
          sudo apt-get update
          # libasound2-dev : NKAudio/ALSA (revele par le probe NKCode).
          sudo apt-get install -y clang libx11-dev libxrandr-dev libxext-dev libgl1-mesa-dev libasound2-dev

      - name: Runtime Python embarque (python-build-standalone, pour NKCode)
        if: inputs.platform != 'ios'
        run: |
          # EPINGLE (pas de « latest ») : CPython 3.12.13, release 20260807 —
          # tous les testeurs recoivent le meme runtime, et un changement de
          # version est un choix explicite, pas un effet de bord.
          # Disposition UNIX identique linux/macos -> la branche POSIX de
          # NkEmbeddedJenga::WorkerMain couvre les deux sans changement.
          REL=20260807
          VER=3.12.13
          if [ "${{ inputs.platform }}" = "macos" ]; then
            TRIPLE=aarch64-apple-darwin
            DEST=Externals/Libs/PythonEmbed/macos
          else
            TRIPLE=x86_64-unknown-linux-gnu
            DEST=Externals/Libs/PythonEmbed/linux
          fi
          curl -fsSL -o /tmp/pbs.tar.gz "https://github.com/astral-sh/python-build-standalone/releases/download/$REL/cpython-$VER%2B$REL-$TRIPLE-install_only.tar.gz"
          tar -xzf /tmp/pbs.tar.gz
          mv python "$DEST"
          echo "runtime pose dans $DEST :"
          ls "$DEST"

      - name: Wheel Jenga (NKCode l'embarque pour ses boutons Construire)
        run: |
          # ⚠️ `pip wheel` ECHOUAIT EN SILENCE SUR LE RUNNER LINUX (2026-09-08) :
          # il sortait `UNKNOWN-0.0.0-py3-none-any.whl` — sans metadonnees, parce
          # que le setuptools du runner ne resolvait pas le `version = attr:
          # Jenga._version.__version__` du pyproject. NKCode ne reconnaissait donc
          # aucun wheel et le paquet Linux partait SANS Jenga embarque : les
          # boutons Construire/Executer inoperants, et rien ne le disait puisque
          # le `|| echo` avalait l'echec. La beta.7 est partie comme ca.
          # `python -m build` (PEP 517, isole) est ce qui fabrique les releases de
          # Jenga : meme chemin, meme resultat. Et on VERIFIE le nom produit.
          set -e
          # PEP 668 : depuis 2026, le Python de Homebrew sur les runners macOS
          # refuse `pip install` et rend « error: externally-managed-environment ».
          # Le message parle d'un environnement gere par le systeme, pas d'un
          # probleme de paquet, et il a fait echouer la construction macOS de la
          # beta.11 en une minute. Un venv jetable contourne proprement : le
          # runner est ephemere, mais on ne touche pas au Python du systeme, et
          # la meme recette vaut sur Linux comme sur macOS.
          python3 -m venv "$RUNNER_TEMP/venv-build"
          "$RUNNER_TEMP/venv-build/bin/python" -m pip install -q --upgrade pip build
          "$RUNNER_TEMP/venv-build/bin/python" -m build --wheel --outdir jenga-src/dist ./jenga-src
          ls jenga-src/dist/
          test -n "$(ls jenga-src/dist/jenga-*.whl 2>/dev/null)"             || { echo "::error::aucun wheel jenga-*.whl produit — le paquet serait sans Jenga embarque"; exit 1; }

      - name: Builder ${{ inputs.target }} (${{ inputs.platform }}, ${{ inputs.config }})
        env:
          PYTHONPATH: ${{ github.workspace }}/jenga-src
          # NKCode.jenga cherche dist/*.whl ici (extraction du Jenga embarqué).
          NKCODE_JENGA_SRC: ${{ github.workspace }}/jenga-src
        run: |
          EXTRA=""
          if [ "${{ inputs.platform }}" = "ios" ]; then EXTRA="--platform ios"; fi
          python3 -m Jenga build --target "${{ inputs.target }}" --config "${{ inputs.config }}" $EXTRA

      - name: Empaqueter ce qui a ete produit
        run: |
          set -e
          mkdir -p paquet
          # On prend tout le dossier de sortie de la cible, quel que soit son nom.
          OUT=$(find Build/Bin -maxdepth 2 -type d -name "${{ inputs.target }}" | head -1)
          echo "sortie: $OUT"
          test -n "$OUT"
          cp -R "$OUT" paquet/
          APP="paquet/${{ inputs.target }}"

          # ── NKCode : paquet COMPLET. L'artefact de build est un binaire NU
          # (les dependfiles du .jenga ne sont materialises qu'au packaging
          # jenga, pas au build — decouvert en assemblant la beta.5). On pose
          # donc ici ce que NkAppFonts/NkAppIcons et NkEmbeddedJenga::
          # Configure() cherchent A COTE de l'executable : data/,
          # tools/python-embed, tools/jenga-src/Jenga (extrait du wheel par
          # NKCode.jenga dans Build/_jenga-embed).
          if [ "${{ inputs.target }}" = "NKCode" ] && [ "${{ inputs.platform }}" != "ios" ]; then
            [ -d "$APP/data" ] || cp -R Applications/NKCode/data "$APP/data"
            if [ "${{ inputs.platform }}" = "macos" ]; then
              PYSRC=Externals/Libs/PythonEmbed/macos
            else
              PYSRC=Externals/Libs/PythonEmbed/linux
            fi
            if [ -d "$PYSRC" ]; then
              mkdir -p "$APP/tools"
              cp -R "$PYSRC" "$APP/tools/python-embed"
            fi
            if [ -d Build/_jenga-embed/Jenga ]; then
              mkdir -p "$APP/tools/jenga-src"
              cp -R Build/_jenga-embed/Jenga "$APP/tools/jenga-src/Jenga"
            fi
            # macOS : python-build-standalone enregistre un install_name ABSOLU
            # dans libpython3.12.dylib -> le binaire chercherait la lib au
            # chemin du RUNNER chez le testeur. On rebascule sur @rpath/ (le
            # rpath @executable_path/tools/python-embed/lib est pose par
            # NKCode.jenga), puis on RE-SIGNE ad hoc : install_name_tool
            # invalide la signature, et arm64 refuse de LANCER un binaire non
            # signe.
            if [ "${{ inputs.platform }}" = "macos" ]; then
              BIN="$APP/NKCode"
              PYDEP=$(otool -L "$BIN" | awk '/libpython/{print $1; exit}')
              echo "libpython liee : ${PYDEP:-aucune}"
              case "$PYDEP" in
                ""|@rpath/*) : ;;
                *) install_name_tool -change "$PYDEP" "@rpath/$(basename "$PYDEP")" "$BIN" ;;
              esac
              codesign --force -s - "$BIN"
              otool -L "$BIN" | head -8
            fi
            echo "contenu du paquet NKCode :"
            ls "$APP" "$APP/tools" 2>/dev/null || true
          fi

          tar -czf "${{ inputs.target }}-${{ inputs.platform }}.tar.gz" -C paquet .
          ls -l "${{ inputs.target }}-${{ inputs.platform }}.tar.gz"

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.target }}-${{ inputs.platform }}-${{ inputs.config }}
          path: ${{ inputs.target }}-${{ inputs.platform }}.tar.gz
