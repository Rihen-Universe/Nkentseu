<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
  <!-- Sphere : un ROND PLEIN (Rihen, 13 aout : « pour la sphere tu dois mettre
       une sphere ou un rond plein »). Deux tentatives ont echoue avant : l'anneau
       fin traverse de deux traits, illisible a 12 px, puis le disque quadrille
       d'un equateur et d'un meridien en creux -- qui redonnait a l'oeil quatre
       quartiers au lieu d'une boule. La masse pleine est ce qui se lit comme un
       volume, et c'est aussi ce que montre l'apercu de Blender.
       Rappel : le rasteriseur SVG maison ne trace pas les strokes -- tout est en
       remplissage. -->
  <path d="M8 1.4a6.6 6.6 0 100 13.2 6.6 6.6 0 000-13.2z"/>
</svg>
