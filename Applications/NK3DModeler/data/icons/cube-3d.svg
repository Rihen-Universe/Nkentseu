<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
  <!-- Cube : silhouette hexagonale en contour, avec le Y des trois aretes vues.
       Il reste creux -- une masse pleine perdrait justement le Y, qui est ce qui
       fait lire « volume » plutot que « hexagone ». Le contour et les aretes
       sont en revanche EPAISSIS (1.9 et 1.4 au lieu de 1.5 et 1.2) : sous 14 px
       les trois aretes s'effacaient avant le contour, et il ne restait qu'un
       hexagone vide. -->
  <path fill-rule="evenodd" d="M8 1.2L13.9 4.6v6.8L8 14.8 2.1 11.4V4.6L8 1.2zm0 1.9L3.75 5.55v4.9L8 12.9l4.25-2.45v-4.9L8 3.1z"/>
  <path d="M7.3 8h1.4v5.3H7.3z"/>
  <path d="M8.35 7.4l4.4-2.55.7 1.2-4.4 2.55z"/>
  <path d="M7.65 7.4L3.25 4.85l-.7 1.2 4.4 2.55z"/>
</svg>
