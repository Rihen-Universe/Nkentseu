<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
  <!-- Liquide : une goutte et sa gouttelette — « pour le liquide tu mets un
       semblant de splash » (Rihen, 13 aout).
       ICONE DEDIEE, et non `metaball` reutilisee : celle-la designe Ball,
       Ellipsoide et Metaball dans le menu Ajouter, ou un splash serait faux. Une
       icone par sujet, comme pour les cheveux.
       La couronne d'eclaboussure de l'apercu Blender ne tient pas a 12 px : ses
       pointes se referment en bouillie. La goutte, elle, garde sa silhouette a
       toute taille et dit « liquide » sans ambiguite. -->
  <path d="M7.2 2.2c-1.6 2.2-3.7 4.9-3.7 7.2a3.7 3.7 0 007.4 0c0-2.3-2.1-5-3.7-7.2z"/>
  <path d="M12.8 7.6c-.6.9-1.4 1.9-1.4 2.8a1.4 1.4 0 002.8 0c0-.9-.8-1.9-1.4-2.8z"/>
</svg>
