       la meme decomposition que le rendu de l'apercu, pour que le bouton annonce
       ce qu'il produit. Les oreilles debordent de chaque cote : c'est ce
       debordement qui rend la silhouette reconnaissable a 12 px, ou aucun detail
       de visage ne survivrait.
