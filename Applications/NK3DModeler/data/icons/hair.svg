<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
  <!-- Cheveux : trois meches. L'apercu de materiau se servait de « curve-bezier »
       faute d'icone dediee -- or cette icone-la designe aussi Bezier, Cercle,
       NURBS, Chemin et Courbe dans le menu Ajouter. La detourner trompait des
       deux cotes : une courbe montree comme des cheveux, des cheveux montres
       comme une courbe. Une icone par sujet (Rihen, 13 aout).
       Meches PLEINES et non traits : le rasteriseur maison ne trace pas les
       strokes, et une masse tient a 12 px la ou un filet disparait. -->
