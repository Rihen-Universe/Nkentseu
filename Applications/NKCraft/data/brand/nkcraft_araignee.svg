    </g>
    <g fill="none" stroke="#F5F5F5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <polyline points="42,43 28,26 16,22"/><polyline points="40,48 22,40 8,44"/>
      <polyline points="40,53 22,60 8,58"/><polyline points="42,58 28,74 16,80"/>
      <polyline points="58,43 72,26 84,22"/><polyline points="60,48 78,40 92,44"/>
      <polyline points="60,53 78,60 92,58"/><polyline points="58,58 72,74 84,80"/>
