<!--
  NKCraft : logo PROVISOIRE, l'araignee (choix de Rihen, 29/09/2026), en attendant
  le designer. Corps = cube en isometrie, pattes = aretes, bouts = sommets, fil =
  toile d'un maillage. Motif frequent des arts des Grassfields (Bamileke, Bamoum).
  MEME dessin que Shell/NkModelerBrand.h (painter) et Resources/gen_icon.ps1
  (icone d'application) : les trois changent ensemble. Repere 100 x 100.
  Couleurs : bleu d'etat #1177D1, ambre de selection #F2980E, fond #141414.
-->
