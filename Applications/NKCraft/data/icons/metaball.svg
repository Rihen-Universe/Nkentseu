<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
  <!-- Metaball / liquide : deux masses PLEINES qui fusionnent. Les deux anneaux
       fins d'avant se lisaient comme deux cercles poses l'un sur l'autre, ce qui
       ne dit rien de la fusion -- toute l'idee d'une metaball.
       PAS de fill-rule="evenodd" ici, volontairement : en evenodd les deux
       disques se PERCERAIENT l'un l'autre a leur intersection. Le remplissage
       nonzero par defaut les soude en une seule masse. -->
  <path d="M5.6 3.4a4.6 4.6 0 100 9.2 4.6 4.6 0 000-9.2z"/>
  <path d="M11 5.3a3.5 3.5 0 100 7 3.5 3.5 0 000-7z"/>
</svg>
