<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1120" width="1640" height="1120" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg      { fill:#FFFFFF; }
      .zone    { fill:#0A555F; fill-opacity:0.06; stroke:#0A555F; stroke-width:1.5; }
      .zone2   { fill:#0A555F; fill-opacity:0.12; stroke:#0A555F; stroke-width:1.5; }
      .rail    { fill:#0A555F; fill-opacity:0.22; stroke:#0A555F; stroke-width:1.5; }
      .logo    { fill:#0A555F; stroke:#0A555F; stroke-width:2; }
      .float   { fill:#F79A28; fill-opacity:0.16; stroke:#F79A28; stroke-width:1.8; }
      .canvasz { fill:#F7FAFA; stroke:#0A555F; stroke-width:1.5; }
      .name    { fill:#0A555F; font-size:15px; font-weight:600; }
      .sub     { fill:#0A555F; font-size:12.5px; opacity:0.72; }
      .tiny    { fill:#0A555F; font-size:11.5px; opacity:0.62; }
      .fname   { fill:#B26A12; font-size:13px; font-weight:600; }
      .dim     { stroke:#F79A28; stroke-width:1.4; }
      .dimtxt  { fill:#B26A12; font-size:12px; font-weight:600; }
      .lead    { stroke:#0A555F; stroke-width:1; stroke-dasharray:3 3; opacity:0.55; }
      .title   { fill:#0A555F; font-size:26px; font-weight:700; }
      .stitle  { fill:#0A555F; font-size:14px; opacity:0.7; }
      .legtxt  { fill:#0A555F; font-size:13px; }
      .warn    { fill:#B26A12; font-size:13px; font-weight:600; }
    </style>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#F79A28"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 z" fill="#F79A28"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1640" height="1120"/>

  <text class="title" x="60" y="52">NkUIDesign — plan de la fenêtre principale</text>
  <text class="stitle" x="60" y="76">Plan de zones, pas une capture. Chaque zone renvoie à sa planche validée (document Banani §22).</text>

  <!-- ============ FENETRE ============ -->
  <!-- cadre exterieur -->
  <rect x="80" y="110" width="1440" height="820" fill="none" stroke="#0A555F" stroke-width="2.5"/>

  <!-- LOGO : chevauche les deux bandes -->
  <rect class="logo" x="80" y="110" width="56" height="56" fill-opacity="0.85"/>
  <text x="108" y="144" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">O</text>

  <!-- BANDE 1 : barre de menu -->
  <rect class="zone2" x="136" y="110" width="1384" height="28"/>
  <text class="name" x="148" y="129">Fichier  Édition  Affichage  Objet  Comportement  IA  Fenêtre  Aide</text>
  <text class="fname" x="800" y="129" text-anchor="middle">• Dashboard_Admin.nkgui</text>
  <text class="sub" x="1508" y="129" text-anchor="end">— □ ×</text>

  <!-- BANDE 2 : onglets de projet -->
  <rect class="zone2" x="136" y="138" width="1384" height="28"/>
  <text class="name" x="148" y="157">Dashboard_Admin ●   Landing_Page   HUD_Jeu   +</text>

  <!-- RAIL GAUCHE -->
  <rect class="rail" x="80" y="166" width="28" height="736"/>
  <text class="tiny" x="94" y="560" text-anchor="middle" transform="rotate(-90 94 560)">rail — palette · bibliothèque</text>

  <!-- HIERARCHIE : deux sections -->
  <rect class="zone" x="108" y="166" width="260" height="470"/>
  <text class="name" x="120" y="190">Hiérarchie</text>
  <text class="sub" x="120" y="210">en-tête · filtre · bascule « à rôle »</text>
  <text class="sub" x="120" y="230">arbre des pages et des éléments</text>
  <text class="sub" x="120" y="250">badge plein = erreur ici</text>
  <text class="sub" x="120" y="268">badge creux = erreur plus bas</text>
  <text class="tiny" x="120" y="292">§11 · planche §22.5</text>
  <text class="tiny" x="120" y="628">poignée déplaçable — hauteur mémorisée</text>

  <!-- poignee -->
  <rect x="108" y="636" width="260" height="10" fill="#0A555F" fill-opacity="0.28" stroke="#0A555F" stroke-width="1.2"/>
  <circle cx="232" cy="641" r="1.8" fill="#0A555F"/><circle cx="238" cy="641" r="1.8" fill="#0A555F"/><circle cx="244" cy="641" r="1.8" fill="#0A555F"/>

  <rect class="zone" x="108" y="646" width="260" height="256"/>
  <text class="name" x="120" y="670">Composants du projet</text>
  <text class="sub" x="120" y="690">ce que le projet possède</text>
  <text class="sub" x="120" y="708">miniature · nom · instances</text>
  <text class="sub" x="120" y="726">point bleu = utilisé ailleurs</text>
  <text class="tiny" x="120" y="750">§11.6 · planche §22.6</text>
  <text class="tiny" x="120" y="782">repliée par défaut</text>

  <!-- CANVAS -->
  <rect class="canvasz" x="368" y="166" width="824" height="736"/>
  <text class="name" x="392" y="192">Canvas</text>
  <text class="sub" x="392" y="212">Design · Behavior · Animation · Split</text>
  <text class="tiny" x="392" y="232">§8 · §9 · §9bis · §10 — planches §22.12, §22.13</text>

  <!-- barre d outils flottante -->
  <rect class="float" x="392" y="380" width="48" height="300" rx="10"/>
  <text class="tiny" x="416" y="540" text-anchor="middle" transform="rotate(-90 416 540)">outils — 48 px</text>

  <!-- bascule de mode, flottante, centree sur le canvas -->
  <rect class="float" x="650" y="196" width="260" height="30" rx="8"/>
  <text class="sub" x="780" y="216" text-anchor="middle">Design | Behavior | Animation | Split</text>

  <!-- cluster de vue -->
  <rect class="float" x="1040" y="850" width="130" height="30" rx="8"/>
  <text class="sub" x="1105" y="870" text-anchor="middle">100 % ▾  ▦  ⌁</text>

  <!-- INSPECTEUR -->
  <rect class="zone" x="1192" y="166" width="300" height="736"/>
  <text class="name" x="1204" y="190">Inspecteur</text>
  <text class="sub" x="1204" y="212">en-tête · nom · ligne de rôle</text>
  <text class="sub" x="1204" y="232">Design | Widget | Behavior</text>
  <text class="sub" x="1204" y="256">1 Cible</text>
  <text class="sub" x="1204" y="274">2 Disposition</text>
  <text class="sub" x="1204" y="292">3 Ancrage</text>
  <text class="sub" x="1204" y="310">4 Alignement</text>
  <text class="sub" x="1204" y="328">5 Espacement</text>
  <text class="sub" x="1204" y="346">6 Apparence</text>
  <text class="sub" x="1204" y="364">7 Typographie</text>
  <text class="sub" x="1204" y="382">8 Effets</text>
  <text class="sub" x="1204" y="400">9 Points de rupture</text>
  <text class="sub" x="1204" y="418">10 Layout parent</text>
  <text class="warn" x="1204" y="446">ordre normatif</text>
  <text class="tiny" x="1204" y="468">§12.2 · planches §22.1 à §22.4</text>

  <!-- RAIL DROIT -->
  <rect class="rail" x="1492" y="166" width="28" height="736"/>
  <text class="tiny" x="1506" y="560" text-anchor="middle" transform="rotate(-90 1506 560)">rail — callbacks · chat IA</text>

  <!-- RAIL BAS -->
  <rect class="rail" x="80" y="902" width="1440" height="28"/>
  <text class="tiny" x="96" y="921">rail bas — console / validation · aperçu</text>

  <!-- ============ COTES ============ -->
  <!-- logo 56 -->
  <line class="dim" x1="80" y1="98" x2="136" y2="98" marker-start="url(#a2)" marker-end="url(#a1)"/>
  <text class="dimtxt" x="108" y="92" text-anchor="middle">56</text>

  <!-- bande 1 -->
  <line class="dim" x1="1540" y1="110" x2="1540" y2="138" marker-start="url(#a2)" marker-end="url(#a1)"/>
  <text class="dimtxt" x="1552" y="128">28</text>
  <!-- bande 2 -->
  <line class="dim" x1="1540" y1="138" x2="1540" y2="166" marker-start="url(#a2)" marker-end="url(#a1)"/>
  <text class="dimtxt" x="1552" y="156">28</text>

  <!-- rails -->
  <line class="dim" x1="80" y1="946" x2="108" y2="946" marker-start="url(#a2)" marker-end="url(#a1)"/>
  <text class="dimtxt" x="94" y="962" text-anchor="middle">28</text>
  <line class="dim" x1="1492" y1="946" x2="1520" y2="946" marker-start="url(#a2)" marker-end="url(#a1)"/>
  <text class="dimtxt" x="1506" y="962" text-anchor="middle">28</text>

  <!-- colonnes -->
  <line class="dim" x1="108" y1="978" x2="368" y2="978" marker-start="url(#a2)" marker-end="url(#a1)"/>
  <text class="dimtxt" x="238" y="994" text-anchor="middle">Hiérarchie — redimensionnable</text>
  <line class="dim" x1="368" y1="978" x2="1192" y2="978" marker-start="url(#a2)" marker-end="url(#a1)"/>
  <text class="dimtxt" x="780" y="994" text-anchor="middle">Canvas — prend tout l'espace restant</text>
  <line class="dim" x1="1192" y1="978" x2="1492" y2="978" marker-start="url(#a2)" marker-end="url(#a1)"/>
  <text class="dimtxt" x="1342" y="994" text-anchor="middle">Inspecteur — redimensionnable</text>

  <!-- ============ NOTES ============ -->
  <line class="lead" x1="136" y1="124" x2="60" y2="124"/>
  <text class="tiny" x="60" y="120" text-anchor="end">2 bandes</text>

  <text class="legtxt" x="60" y="1032">Le logo chevauche les deux bandes : il commence en haut de la première et finit en bas de la seconde. Les deux bandes commencent à sa droite, jamais au bord.</text>
  <text class="legtxt" x="60" y="1054">Les rails de pastilles sont EN DEHORS de la Hiérarchie et de l'Inspecteur, qui sont des panneaux fixes distincts (§13.1).</text>
  <text class="warn" x="60" y="1082">Il n'existe pas de troisième bande d'outils. Les outils flottent au-dessus du canvas, ils ne bordent pas la fenêtre.</text>
  <text class="legtxt" x="60" y="1104">Zones en orange = flottantes au-dessus du canvas, elles ne le redimensionnent pas.</text>
</svg>
